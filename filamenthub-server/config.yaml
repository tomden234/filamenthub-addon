name: FilamentHub Server
version: "1.3.107"
slug: filamenthub_server
description: Zeichnet jeden Druck deines Bambu-Druckers rund um die Uhr auf, auch ohne offene App.
url: https://github.com/tomden234/filamenthub-addon
# 1.326: fertiges Paket aus GitHub Actions (addon.yml), Home Assistant baut nichts mehr selbst
image: ghcr.io/tomden234/filamenthub-server-{arch}
arch:
  - aarch64
  - amd64
  - armv7
# 1.376: Zugriff auf Bluetooth des Pi (D-Bus von Home Assistant OS), für den Bluetooth-Test
host_dbus: true
startup: application
boot: auto
init: false
homeassistant_api: true
# Zugriff auf den Home-Assistant-Ordner: ESP-YAML für ESPHome (esphome/) und Fotos für Push-Meldungen (www/filamenthub/)
map:
  - homeassistant_config:rw
# Knopf „Web-UI öffnen“ in Home Assistant: die App direkt vom Pi
webui: http://[HOST]:[PORT:3000]
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: FilamentHub Server (Adresse für die Apps)
options:
  printer_ip: ""
  serial: ""
  access_code: ""
  api_key: ""
  notify_service: ""
  gemini_api_key: ""
  mail_user: ""
  mail_password: ""
  trockner_steckdose: ""
  trockner_auto_aus: false
  github_token: ""
  sicherung_passwort: ""
schema:
  printer_ip: str
  serial: str
  access_code: password
  api_key: password?
  notify_service: str?
  gemini_api_key: password?
  mail_user: str?
  mail_password: password?
  trockner_steckdose: str?
  trockner_auto_aus: bool?
  github_token: password?
  sicherung_passwort: password?
watchdog: http://[HOST]:[PORT:3000]/healthz
